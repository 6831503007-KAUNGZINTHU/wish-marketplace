# Spring Boot Configuration for Wish Marketplace Reverse E-Commerce
# Supports both Embedded H2 (default profile) and Google Cloud SQL MySQL

spring.application.name=wish-marketplace-backend
server.port=8080

# -------------------------------------------------------------
# Active Profile: 'h2' for Embedded In-Memory or 'cloudsql' for Cloud SQL MySQL
# -------------------------------------------------------------
spring.profiles.active=h2

# -------------------------------------------------------------
# Embedded H2 Configuration (Default Profile - Zero External Setup Required)
# -------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:wishmarket_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------
# JPA / Hibernate & SQL Schema Initialization
# Use ddl-auto=none because schema.sql and data.sql initialize the schema deterministically
# -------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initialize Schema & Seed Data on Startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Serve React SPA Static Assets
spring.web.resources.static-locations=classpath:/static/

